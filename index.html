<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEARCH FIT — 검색 최적화 진단·재작성 콘솔</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#0b57d0; --on-primary:#fff;
  --primary-container:#d3e3fd; --on-primary-container:#041e49;
  --secondary-container:#e8eef7; --on-secondary:#1b2b47;
  --surface:#f7f9fd; --surface-1:#eff3fa; --surface-2:#e7edf7; --surface-card:#fff;
  --outline:#c3c8d0; --outline-soft:#e2e6ee;
  --on-surface:#1a1c1e; --on-surface-var:#5c6470;
  --seo:#0b57d0; --geo:#8430ce; --aeo:#e8710a; --neo:#00873c;
  --ok:#1e8e3e; --warn:#b3261e; --track:#e3e8f0;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;--s8:32px;--s10:40px;
  --r-xl:28px;--r-l:20px;--r-m:12px;--r-pill:999px;
  --ease:cubic-bezier(.2,0,0,1);
  --split:calc(50% - 4px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--surface);color:var(--on-surface);
  font-family:'Noto Sans KR','Roboto',sans-serif;font-size:14px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
.app{display:grid;grid-template-columns:72px 1fr;height:100vh;position:relative}

/* ── 1단: 팝업식 메뉴 레일 ───────────────── */
.rail{
  background:var(--surface-1);border-right:1px solid var(--outline-soft);
  display:flex;flex-direction:column;align-items:center;gap:var(--s1);padding:var(--s5) 0;z-index:30;
}
.rail .mark{
  width:44px;height:44px;border-radius:var(--r-m);background:var(--primary);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:16px;margin-bottom:var(--s5);
}
.rail button{
  all:unset;width:60px;padding:var(--s2) 0;display:flex;flex-direction:column;align-items:center;gap:2px;
  cursor:pointer;color:var(--on-surface-var);font-size:10.5px;font-weight:500;
}
.rail button .ico{
  width:52px;height:30px;border-radius:var(--r-pill);display:grid;place-items:center;font-size:16px;
  transition:background-color .18s var(--ease),transform .18s var(--ease);
}
.rail button:hover .ico{background:var(--surface-2)}
.rail button:focus-visible .ico{outline:2px solid var(--primary);outline-offset:2px}
.rail button:active .ico{transform:scale(.94)}
.rail button[aria-expanded="true"]{color:var(--on-primary-container)}
.rail button[aria-expanded="true"] .ico{background:var(--primary-container)}
.rail .sp{flex:1}

/* 팝업 패널 */
.pop{
  position:absolute;left:72px;top:0;bottom:0;width:392px;z-index:29;
  background:var(--surface-card);border-right:1px solid var(--outline-soft);
  box-shadow:8px 0 28px rgba(16,24,40,.10);
  display:flex;flex-direction:column;
  transform:translateX(-12px);opacity:0;pointer-events:none;
  transition:transform .2s var(--ease),opacity .16s var(--ease);
}
.pop.on{transform:none;opacity:1;pointer-events:auto}
.pop header{
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--s5) var(--s5) var(--s3);border-bottom:1px solid var(--outline-soft);
}
.pop header b{font-size:16px;letter-spacing:-.2px}
.pop .body{padding:var(--s5);overflow:auto;flex:1}
.pop .x{all:unset;cursor:pointer;width:32px;height:32px;border-radius:var(--r-pill);display:grid;place-items:center;color:var(--on-surface-var)}
.pop .x:hover{background:var(--surface-1)}
.pop .x:focus-visible{outline:2px solid var(--primary)}

/* ── 스테이지 ─────────────────────────────── */
.stage{display:flex;flex-direction:column;min-width:0;height:100vh}
.bar{
  display:flex;align-items:center;gap:var(--s4);padding:var(--s4) var(--s6);
  border-bottom:1px solid var(--outline-soft);background:var(--surface);flex:0 0 auto;
}
.brand{font-size:19px;font-weight:700;letter-spacing:-.5px;white-space:nowrap}
.brand em{font-style:normal;color:var(--primary)}
.pills{display:flex;gap:var(--s2);margin-left:var(--s4)}
.pill{
  display:flex;align-items:center;gap:6px;border:1px solid var(--outline-soft);background:var(--surface-card);
  border-radius:var(--r-pill);padding:5px 12px;font-size:12px;font-weight:500;color:var(--on-surface-var);
}
.pill i{width:8px;height:8px;border-radius:50%}
.pill b{font-family:'Roboto';font-size:13px;color:var(--on-surface)}
.bar .sp{flex:1}
.btn{
  all:unset;box-sizing:border-box;padding:10px 22px;border-radius:var(--r-pill);cursor:pointer;
  font-size:13.5px;font-weight:500;text-align:center;white-space:nowrap;
  transition:transform .16s var(--ease),box-shadow .16s var(--ease),background-color .16s var(--ease);
}
.btn.filled{background:var(--primary);color:var(--on-primary)}
.btn.filled:hover{box-shadow:0 1px 3px rgba(0,0,0,.3),0 4px 8px rgba(0,0,0,.15)}
.btn.tonal{background:var(--secondary-container);color:var(--on-secondary)}
.btn.tonal:hover{background:var(--surface-2)}
.btn.text{padding:10px 14px;color:var(--primary)}
.btn.text:hover{background:var(--primary-container)}
.btn.sm{padding:6px 14px;font-size:12.5px}
.btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.38;pointer-events:none}

/* ── 2·3단: 원문 / 재작성 ─────────────────── */
.panes{flex:1;display:grid;grid-template-columns:var(--split) 8px 1fr;min-height:0;padding:var(--s5) var(--s6) var(--s6);gap:0}
.pane{
  background:var(--surface-card);border:1px solid var(--outline-soft);border-radius:var(--r-xl);
  display:flex;flex-direction:column;min-width:0;overflow:hidden;
}
.pane > .ph{
  display:flex;align-items:center;gap:var(--s3);padding:var(--s4) var(--s5);
  border-bottom:1px solid var(--outline-soft);flex:0 0 auto;
}
#viewSeg{margin:0 0 0 12px}
.ph .nm,.seg button{white-space:nowrap}
.ph .tag{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--on-surface-var)}
.ph .nm{font-size:15px;font-weight:700;letter-spacing:-.2px}
.ph .sp{flex:1}
.ph .cnt{font-size:12px;color:var(--on-surface-var);font-family:'Roboto'}
.pane .pb{flex:1;min-height:0;overflow:auto}
.pane textarea{
  width:100%;height:100%;border:0;outline:none;resize:none;background:transparent;
  font-family:inherit;font-size:14px;line-height:1.85;padding:var(--s5);color:var(--on-surface);
}
/* 드래그 핸들 */
.handle{cursor:col-resize;display:grid;place-items:center;position:relative}
.handle::after{
  content:'';width:4px;height:56px;border-radius:2px;background:var(--outline);
  transition:background-color .16s var(--ease),transform .16s var(--ease);
}
.handle:hover::after{background:var(--primary);transform:scaleY(1.35)}
.handle.drag::after{background:var(--primary);transform:scaleY(1.6)}
body.resizing{cursor:col-resize;user-select:none}

/* 재작성 문서 */
.doc{padding:var(--s6) var(--s8);max-width:760px}
.doc h1{font-size:28px;line-height:1.3;font-weight:700;letter-spacing:-.8px;margin:0 0 var(--s3)}
.doc h2{font-size:18px;font-weight:700;margin:var(--s8) 0 var(--s3);letter-spacing:-.3px}
.doc h3{font-size:14.5px;font-weight:700;margin:var(--s5) 0 var(--s1)}
.doc p{margin:0 0 var(--s3)}
.doc ul{margin:0 0 var(--s3);padding-left:20px}
.doc li{margin-bottom:var(--s1)}
.doc blockquote{
  margin:0 0 var(--s5);padding:var(--s4) var(--s5);background:var(--primary-container);
  color:var(--on-primary-container);border-radius:var(--r-l);
}
.doc blockquote p:last-child,.doc blockquote ul{margin-bottom:0}
.doc img{max-width:100%;border-radius:var(--r-m);margin-bottom:var(--s3)}
.doc pre{
  background:var(--surface-1);border-radius:var(--r-m);padding:var(--s4);overflow:auto;
  font-family:'Roboto Mono','Noto Sans KR',monospace;font-size:12.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;
}
.doc .alt{font-size:12.5px;color:var(--on-surface-var);border-left:3px solid var(--outline-soft);padding-left:var(--s3);margin-bottom:var(--s5)}
.doc .flag{color:var(--warn)}
/* 축별 색 — 진단 카드·점수칩과 같은 색을 쓴다 */
.axwrap{--ax:var(--aeo);border-left:3px solid var(--ax);padding-left:16px;margin:0 0 var(--s6);color:var(--ax)}
.axwrap.ax-seo{--ax:var(--seo)} .axwrap.ax-geo{--ax:var(--geo)}
.axwrap.ax-aeo{--ax:var(--aeo)} .axwrap.ax-neo{--ax:var(--neo)}
.axwrap > *:last-child{margin-bottom:0}
.axhead{display:flex;align-items:center;gap:6px;margin-bottom:var(--s2);flex-wrap:wrap}
.axtag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.4px;color:#fff;border-radius:var(--r-pill);padding:2px 10px;background:var(--aeo)}
.axtag.ax-seo{background:var(--seo)} .axtag.ax-geo{background:var(--geo)}
.axtag.ax-aeo{background:var(--aeo)} .axtag.ax-neo{background:var(--neo)}
.axlabel{font-size:11.5px;font-weight:700;color:var(--ax)}
.axwhy{display:block;font-size:12.5px;line-height:1.65;color:var(--ax);margin-bottom:var(--s3)}
.axwrap h1,.axwrap h2,.axwrap h3,.axwrap p,.axwrap li,.axwrap blockquote{color:var(--ax)}
.axwrap blockquote{background:color-mix(in srgb, var(--ax) 9%, #fff)}
.badge{font-size:11px;font-weight:700;letter-spacing:.4px;border-radius:var(--r-pill);padding:3px 10px;background:var(--surface-1);color:var(--on-surface-var)}
.badge.ai{background:var(--primary-container);color:var(--on-primary-container)}
.diff{padding:var(--s6) var(--s8);max-width:760px;line-height:2.1;white-space:pre-wrap;word-break:break-word}
.diff ins{background:#fde8e8;color:#b3261e;text-decoration:none;border-radius:3px;padding:1px 3px;font-weight:500}
.diff del{color:#9aa0a6;text-decoration:line-through}
.dsum{margin:var(--s5) var(--s8) 0;background:var(--surface-1);border-radius:var(--r-l);padding:var(--s4) var(--s5)}
.dsum b{font-size:13px;display:block;margin-bottom:var(--s2)}
.dsum ul{margin:0;padding-left:18px;font-size:13px;color:var(--on-surface-var)}
.dsum li{margin-bottom:2px}
.dlegend{display:flex;gap:var(--s4);align-items:center;padding:var(--s4) var(--s8) 0;font-size:12px;color:var(--on-surface-var);flex-wrap:wrap}
.dlegend b{font-family:'Roboto';color:var(--on-surface)}
.dkey{display:inline-flex;align-items:center;gap:6px}
.dkey i{width:12px;height:12px;border-radius:3px;display:block}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s3);height:100%;color:var(--on-surface-var);font-size:13.5px;text-align:center;padding:var(--s8)}
.empty p{margin:0;max-width:34ch;line-height:1.7}

/* 팝업 내부 폼 */
.seg{display:inline-flex;border:1px solid var(--outline);border-radius:var(--r-pill);overflow:hidden;margin-bottom:var(--s4)}
.seg button{all:unset;padding:8px 20px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--on-surface-var);transition:background-color .16s var(--ease)}
.seg button:hover{background:var(--surface-1)}
.seg button:focus-visible{outline:2px solid var(--primary);outline-offset:-2px}
.seg button[aria-selected="true"]{background:var(--primary-container);color:var(--on-primary-container)}
.field{margin-bottom:var(--s4)}
.field label{display:block;font-size:12px;font-weight:500;color:var(--on-surface-var);margin-bottom:6px}
input[type=text],input[type=url],input[type=password]{
  width:100%;font-family:inherit;font-size:13.5px;color:var(--on-surface);
  background:var(--surface-1);border:1px solid transparent;border-bottom:1px solid var(--outline);
  border-radius:var(--r-m) var(--r-m) 0 0;padding:11px var(--s4);
  transition:background-color .16s var(--ease),border-color .16s var(--ease);
}
input:hover{background:var(--surface-2)}
input:focus{outline:none;border-bottom:2px solid var(--primary)}
.hint{color:var(--on-surface-var);font-size:12px;display:block;margin-top:var(--s2)}
.aibox{margin-top:var(--s6);padding-top:var(--s5);border-top:1px solid var(--outline-soft)}
.airow{display:flex;align-items:center;gap:8px;font-size:13.5px;margin-bottom:4px}
.aidot{width:8px;height:8px;border-radius:50%;background:var(--outline);flex:0 0 8px}
.aidot.on{background:var(--ok)}
.stack{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s4)}

/* 진단 패널 */
.axis{margin-bottom:var(--s6)}
.axis .ah{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s3)}
.axis .ah i{width:9px;height:9px;border-radius:50%}
.axis .ah b{font-size:14px}
.axis .ah em{font-style:normal;margin-left:auto;font-family:'Roboto';font-weight:700;font-size:13px;color:var(--on-surface-var)}
.meter{height:6px;border-radius:3px;background:var(--track);overflow:hidden;margin-bottom:var(--s3)}
.meter span{display:block;height:100%;border-radius:3px;transform-origin:left;transition:transform .4s var(--ease)}
.checks{margin:0;padding:0;list-style:none}
.checks li{display:flex;gap:var(--s3);padding:9px 0;border-bottom:1px solid var(--outline-soft);align-items:flex-start}
.checks li:last-child{border-bottom:0}
.checks .mk{flex:0 0 18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;color:#fff;margin-top:2px}
.checks .mk.y{background:var(--ok)} .checks .mk.n{background:var(--warn)}
.checks .t{font-weight:500;font-size:13px}
.checks .f{color:var(--on-surface-var);font-size:12px;margin-top:1px}

.toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);opacity:0;pointer-events:none;
  background:#31373d;color:#fff;padding:11px 18px;border-radius:var(--r-m);font-size:13px;
  transition:opacity .18s var(--ease),transform .18s var(--ease);z-index:60;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── 반응형 ───────────────────────────────────
   1200px 이하: 두 창을 위아래로 쌓지 않고 한 번에 하나만 — 좁은 화면에서 나란히 비교는 어차피 불가능하다 */
.only-m{display:none}
@media (max-width:1200px){
  .only-m{display:inline-flex}
  .panes{grid-template-columns:1fr;padding:var(--s4)}
  .handle{display:none}
  .panes[data-show="src"] .pane:last-of-type{display:none}
  .panes[data-show="out"] .pane:first-of-type{display:none}
  .bar{flex-wrap:wrap;row-gap:var(--s3);padding:var(--s3) var(--s4)}
  .pills{margin-left:0;order:3;width:100%;flex-wrap:wrap;row-gap:var(--s2)}
  .doc,.diff{padding:var(--s5);max-width:none}
  .dlegend{padding:var(--s4) var(--s5) 0}
  .dsum{margin:var(--s4) var(--s5) 0}
}
@media (max-width:720px){
  .app{grid-template-columns:56px 1fr}
  .rail{padding:var(--s3) 0}
  .rail .mark{width:38px;height:38px;font-size:14px;margin-bottom:var(--s3)}
  .rail button{width:52px;font-size:10px}
  .rail button .ico{width:44px;height:28px;font-size:15px}
  .pop{left:56px;width:calc(100vw - 56px);box-shadow:0 12px 32px rgba(16,24,40,.24)}
  .brand{font-size:16px}
  .pill{padding:4px 9px;font-size:11px}
  .btn{padding:9px 16px;font-size:13px}
  .panes{padding:var(--s3);gap:var(--s3)}
  .pane{border-radius:var(--r-l)}
  .pane .ph{padding:var(--s3) var(--s4)}
  .ph .tag{display:none}
  .pane .ph{gap:var(--s2)}
  #viewSeg{margin-left:var(--s2)}
  #viewSeg button{padding:5px 9px;font-size:11.5px}
  .ph .nm{font-size:13px}
  .badge{display:none}
  #btnCopy{padding:8px 10px}
  .pane textarea{font-size:16px;padding:var(--s4)}   /* 16px 미만이면 iOS가 포커스 때 확대한다 */
  .doc,.diff{padding:var(--s4)}
  .dlegend{padding:var(--s3) var(--s4) 0}
  .dsum{margin:var(--s3) var(--s4) 0}
  .doc h1{font-size:22px}
  .doc h2{font-size:16px;margin-top:var(--s6)}
  input[type=text],input[type=url],input[type=password]{font-size:16px}
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail">
    <div class="mark">SF</div>
    <button id="mInput" aria-expanded="false"><span class="ico">✎</span>입력</button>
    <button id="mDiag" aria-expanded="false"><span class="ico">◎</span>진단</button>
    <span class="sp"></span>
    <button id="mReset" aria-expanded="false"><span class="ico">↺</span>초기화</button>
  </nav>

  <aside class="pop" id="pop">
    <header><b id="popTitle">입력</b><button class="x" id="popX" aria-label="닫기">✕</button></header>
    <div class="body" id="popBody"></div>
  </aside>

  <section class="stage">
    <div class="bar">
      <span class="brand">SEARCH <em>FIT</em></span>
      <div class="pills" id="pills"></div>
      <div class="seg only-m" id="paneSeg">
        <button data-p="src" aria-selected="true">원문</button>
        <button data-p="out" aria-selected="false">재작성</button>
      </div>
      <span class="sp"></span>
      <button class="btn text" id="btnShare">공유 링크</button>
      <button class="btn text" id="btnSave">.md 저장</button>
      <button class="btn tonal" id="btnSample">샘플</button>
      <button class="btn filled" id="btnRun">진단 · 재작성 실행</button>
    </div>

    <div class="panes" id="panes" data-show="src">
      <div class="pane">
        <div class="ph">
          <span class="tag">ORIGINAL</span><span class="nm">원문</span>
          <span class="sp"></span><span class="cnt" id="cnt">0자</span>
        </div>
        <div class="pb"><textarea id="src" placeholder="기사 본문을 붙여넣거나, 왼쪽 [입력] 메뉴에서 URL을 불러오세요."></textarea></div>
      </div>

      <div class="handle" id="handle" title="드래그로 좌우 폭 조절 · 더블클릭 시 50:50"></div>

      <div class="pane">
        <div class="ph">
          <span class="tag">OPTIMIZED</span><span class="nm">재작성</span>
          <div class="seg" id="viewSeg">
            <button aria-selected="true" data-v="doc">문서</button>
            <button aria-selected="false" data-v="diff">체크</button>
          </div>
          <span class="sp"></span>
          <span class="badge" id="srcBadge"></span>
          <button class="btn text sm" id="btnCopy">복사</button>
        </div>
        <div class="pb" id="outWrap">
          <div class="empty">진단을 실행하면 최적화된 글이 여기에 만들어집니다.</div>
        </div>
      </div>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
const CFG = Object.assign({apiKey:'', model:'claude-sonnet-5', autoRewrite:true}, window.SEARCHFIT_CONFIG||{});
/* 키는 이 브라우저에 저장한 것을 먼저 쓰고, 없으면 config.js를 쓴다 */
const KEY_STORE='searchfit_key';
function getKey(){
  try{ return (localStorage.getItem(KEY_STORE)||'').trim() || CFG.apiKey; }
  catch(e){ return CFG.apiKey; }
}
function setKey(k){
  try{ k ? localStorage.setItem(KEY_STORE,k.trim()) : localStorage.removeItem(KEY_STORE); }catch(e){}
}
const AXES = [
  {k:'seo', name:'SEO', full:'Search Engine Optimization', color:'var(--seo)'},
  {k:'geo', name:'GEO', full:'Generative Engine Optimization', color:'var(--geo)'},
  {k:'aeo', name:'AEO', full:'Answer Engine Optimization', color:'var(--aeo)'},
  {k:'neo', name:'NEO', full:'네이버 검색 최적화', color:'var(--neo)'},
];

/* ── 1. 파싱 ──────────────────────────────────── */
/* 언론사 페이지에서 딸려 오는 안내·구독 문구. 본문이 아니다 */
const NOISE_LINE = /(글자크기|기사의 본문 내용은|무단전재|재배포\s*금지|저작권자\s*©|댓글\s*\d+|좋아요\s*\d+|SNS\s*로그인|구독하고|구독중|주요\s*뉴스를 메인|섹션으로 분류|기사의 섹션 정보|언론사에서 선정|아웃링크|언론사홈|프린트하기|스크랩|^닫기$)/;
function isNoiseLine(l){
  const t=String(l).trim();
  return !!t && NOISE_LINE.test(t) && t.length<120;
}
/* [[속보] 제목](url) 처럼 대괄호가 한 단계 중첩된 링크까지 잡는다 */
const MD_LINK = /\[(?:[^\[\]]|\[[^\]]*\])*\]\([^)]*\)/g;
const ENTITY = {'&amp;':'&','&lt;':'<','&gt;':'>','&quot;':'"','&#39;':"'",'&apos;':"'",'&nbsp;':' '};
function decodeEntities(t){
  return String(t).replace(/&(amp|lt|gt|quot|#39|apos|nbsp);/g, m=>ENTITY[m]||m);
}
function parse(raw){
  const text = decodeEntities(String(raw||'').replace(/\r/g,'')).trim();
  const lines = text.split('\n');
  const headings = lines.filter(l=>/^#{1,6}\s/.test(l))
    .map(l=>({level:l.match(/^#+/)[0].length, text:l.replace(/^#+\s*/,'').trim()}));
  const images = (text.match(/!\[[^\]]*\]\([^)]+\)/g)||[]);
  // 문장·문단으로 다룰 때는 마크다운 기호를 걷어낸다. 남겨두면 요약·재작성본에 '*'가 따라붙는다
  const isLinkLine = t => {
    const b=String(t).replace(/^\s*([-*•]|\d+[.)])\s*/,'').trim();
    if(!b) return false;
    const lc=(b.match(MD_LINK)||[]).join('').length;
    return lc/b.length > 0.6;      // 줄 대부분이 링크 = 관련기사·메뉴이지 본문이 아니다
  };
  const strip = t => String(t)
    .replace(/^#{1,6}\s*/,'')
    .replace(/^\s*([-*•]|\d+[.)])\s+/,'')
    .replace(/\*\*([^*]+)\*\*/g,'$1')
    .replace(/(?:^|(?<=\s))_([^_]+)_(?=\s|$|[.,·)])/g,'$1')
    .replace(/!\[([^\]]*)\]\([^)]*\)/g,'')
    .replace(MD_LINK, m => m.slice(1, m.lastIndexOf('](')))
    .trim();
  const plain = text.split('\n')
    .map(l => (isLinkLine(l) || isNoiseLine(l)) ? '' : strip(l))
    .join('\n');
  const title = (headings.find(h=>h.level===1)||{}).text || (lines.find(l=>l.trim())||'').replace(/^#+\s*/,'').trim();
  const headTexts = new Set(headings.map(h=>h.text).concat([title]));
  // 제목·소제목 줄은 본문 문단이 아니다 — 리드 문단·메타 추출이 제목으로 오염된다
  const paras = plain.split(/\n{2,}/).map(s=>s.trim()).filter(s=>s && !headTexts.has(s));
  // 제목·소제목은 본문 문장이 아니다 — 요약·FAQ 근거로 뽑히면 안 된다
  const sentences = plain.split(/(?:(?<=[.!?。？！])\s+)|\n+/).map(s=>s.trim())
    .filter(s=>s.length>12 && !headTexts.has(s));
  const chars = plain.replace(/\s/g,'').length;
  // 소제목-문단 묶음 — 재작성 시 원문 순서를 그대로 유지하기 위해 필요하다
  const sections=[]; let cur={heading:null, paras:[]};
  for(const raw of lines){
    const h = raw.match(/^(#{2,6})\s+(.*)$/);
    if(h){ sections.push(cur); cur={heading:h[2].trim(), paras:[]}; continue; }
    if(isLinkLine(raw) || isNoiseLine(raw)) continue;
    const t = strip(raw);
    if(!t || headTexts.has(t)) continue;
    const last = cur.paras[cur.paras.length-1];
    if(last && !/^\s*$/.test(raw) && false) cur.paras[cur.paras.length-1]=last+' '+t;
    else cur.paras.push(t);
  }
  sections.push(cur);
  const secs = sections.filter(x=>x.heading!==null||x.paras.length);
  return {
    text, plain, lines, headings, images, paras, sentences, title, chars, secs,
    h2: headings.filter(h=>h.level>=2).length,
    links: (text.match(/https?:\/\/\S+/g)||[]).length + (text.match(/\]\(/g)||[]).length,
    numbers: (plain.match(/\d[\d,.]*\s*(%|퍼센트|명|억|만|천|원|달러|배|위|년|월|일|주|건|개|가지|대|차|호|시간|분|초|℃|kg|km|포인트|곳|사)/g)||[]),
    sources: (plain.match(/(에 따르면|출처|자료:|발표했|발표한|조사에|보고서|기준으로|공시|인용|밝혔다|밝혔습니다|설명했다|전했다|제공|공개했다)/g)||[]),
    quotes: (plain.match(/["“][^"”]{10,}["”]/g)||[]).concat(plain.match(/라고 (말했|밝혔|설명했)/g)||[]),
    experts: (plain.match(/(교수|연구원|대표|장관|위원장|박사|애널리스트|CEO|팀장|센터장)/g)||[]),
    bullets: lines.filter(l=>/^\s*([-*•]|\d+[.)])\s+/.test(l)).length,
    tables: (text.match(/^\|.+\|$/gm)||[]).length,
    // 한국 기사는 "9일 밝혔다", "지난 5월"처럼 쓴다 — 연도 표기만 보면 전부 놓친다
    dates: (plain.match(/(20\d{2}\s*년|20\d{2}[-.]\s?\d{1,2}[-.]\s?\d{1,2}|\d{1,2}월\s*\d{1,2}일|\d{1,2}일\s*(?:밝|말|전|발표|공시|출시|시작)|지난해|올해|내년|지난달|이달|지난 \d{1,2}월)/g)||[]),
    author: /(기자|글:|작성자|필자|취재|에디터)/.test(plain),
    faq: /(FAQ|자주\s*묻는|자주하는 질문|Q\s*[.:&]|Q1)/i.test(text),
    summary: /(요약|한눈에|핵심 정리|TL;?DR|세 줄)/i.test(text),
    jsonld: /(application\/ld\+json|schema\.org)/i.test(text),
    convo: (plain.match(/(어떻게|왜|무엇|언제|어디서|얼마나)/g)||[]),
    media: /(사진|영상|그래프|도표|이미지|차트|인포그래픽)/.test(plain) || images.length>0,
  };
}
/* 제목 어절에서 조사를 뗀 뒤, 본문에 실제로 많이 나오는 말을 고른다.
   길이만 보면 '부담에도'처럼 조사가 붙은 어절을 통째로 집는다. */
function autoKeyword(d){
  const src = d.title || d.plain.slice(0,120);
  const cands = [...new Set(src.split(/[^가-힣A-Za-z0-9]+/).map(stem).filter(w=>w.length>=2))];
  if(!cands.length) return '';
  const count = w => (d.plain.match(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'))||[]).length;
  return cands.map(w=>({w, n:count(w)}))
              .sort((a,b)=> b.n-a.n || b.w.length-a.w.length)[0].w;
}
/* 한국어 키워드구는 본문에 통째로 등장하지 않는다 — 토큰 단위로 판정한다 */
function tokens(kw){ return String(kw||'').split(/[^가-힣A-Za-z0-9]+/).filter(w=>w.length>=2); }
function has(text,kw){
  const t = tokens(kw);
  return t.length ? t.every(w=>text.includes(w)) : false;
}
function density(d,kw){
  const t = tokens(kw);
  if(!t.length || !d.chars) return 0;
  // 대표 토큰(가장 긴 것) 기준 — 구 전체 완전일치는 한국어에서 거의 0이 된다
  const main = t.sort((a,b)=>b.length-a.length)[0];
  const n = (d.plain.match(new RegExp(main.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g'))||[]).length;
  return +(n*main.length/d.chars*100).toFixed(2);
}
function thirdsHit(d,kw){
  if(!tokens(kw).length) return 0;
  const p=d.plain, n=Math.ceil(p.length/3);
  return [p.slice(0,n),p.slice(n,2*n),p.slice(2*n)].filter(s=>has(s,kw)).length;
}

/* ── 2. 진단 ──────────────────────────────────── */
const C = (ok,t,f)=>({ok:!!ok,t,f});
function diagnose(d,kw){
  const dens = density(d,kw);
  const firstPara = d.paras[0]||'';
  const qHead = d.headings.filter(h=>isQuestion(h.text)||/^(왜|어떻게|무엇|언제|어디|누가|얼마)/.test(h.text)).length;
  const leadLen = (d.sentences[0]||'').length;

  const seo = [
    C(d.title.length>=15 && d.title.length<=40, `제목 길이 ${d.title.length}자`, '검색결과 잘림 없이 15~40자'),
    C(has(d.title,kw), '제목에 타깃 키워드 포함', `제목 앞부분에 "${kw}" 구성어를 모두 넣으세요`),
    C(has(firstPara,kw), '첫 문단에 키워드 등장', '첫 150자 안에 키워드를 한 번 노출'),
    C(d.chars>=900, `본문 분량 ${d.chars}자`, '경쟁 가능한 최소 분량 900자'),
    C(d.h2>=2, `소제목(H2+) ${d.h2}개`, '주제를 2개 이상 소제목으로 분절'),
    C(dens>=0.4 && dens<=2.5, `키워드 밀도 ${dens}%`, '0.4~2.5% 구간 유지 (과다는 스팸 신호)'),
    C(d.links>=1, `링크 ${d.links}개`, '근거·관련 문서로 나가는 링크 1개 이상'),
    C(d.images.length>=1, `이미지 ${d.images.length}개`, '대표 이미지 + alt 텍스트 추가'),
  ];
  const geo = [
    C(d.numbers.length>=3, `인용 가능한 수치 ${d.numbers.length}개`, 'LLM이 집어갈 구체 수치를 3개 이상'),
    C(d.sources.length>=2, `출처 표기 ${d.sources.length}회`, '"~에 따르면", "출처:" 형태로 근거를 명시'),
    // 국내 기사·콘텐츠는 해요체를 많이 쓴다 — 해라체만 보면 정의문을 통째로 놓친다
    C(/(이란|란 |라 함은|를 뜻한다|를 의미한다|는 .{2,30}이다|를 의미해요|을 의미해요|를 뜻해요|을 뜻해요|를 말해요|이라고 해요|라고 해요)/.test(d.plain),
      '정의 문장 존재', '핵심 개념을 한 문장으로 정의 (LLM 인용 1순위)'),
    C(d.bullets>=3 || d.tables>=3, `구조화 블록 ${d.bullets+d.tables}줄`, '리스트·표로 사실을 분해해 두기'),
    C(d.quotes.length>=1, `직접 인용 ${d.quotes.length}건`, '전문가 발언을 큰따옴표로 인용'),
    C(d.experts.length>=1, '권위 주체 언급', '직함·기관명을 밝혀 신뢰 신호 부여'),
  ];
  const aeo = [
    C(qHead>=1, `질문형 소제목 ${qHead}개`, '소제목을 실제 검색 질문 형태로'),
    C(leadLen>=40 && leadLen<=140, `첫 문장 ${leadLen}자`, '40~140자 직답 문장으로 시작 (스니펫 선점)'),
    C(d.faq, 'FAQ 섹션 존재', '자주 묻는 질문 3~5개를 문서 하단에'),
    C(d.summary, '요약/핵심 정리 블록', '상단에 3줄 요약 배치'),
    C(d.bullets>=3, `불릿 ${d.bullets}줄`, '답변으로 발췌되기 쉬운 목록 형태'),
    C(d.jsonld, '구조화 데이터 언급', 'FAQPage / Article JSON-LD 삽입'),
  ];
  // NEO — 네이버 검색 최적화. 구글과 기준이 다른 항목만 본다
  const avgPara = d.paras.length ? Math.round(d.paras.join('').length/d.paras.length) : 0;
  const neo = [
    C(d.title.length<=25, `제목 ${d.title.length}자`, '네이버 검색결과는 25자 안팎에서 잘립니다'),
    C(d.images.length>=1, `이미지 ${d.images.length}장`, '이미지가 있어야 스마트블록·이미지 검색에 노출됩니다'),
    C(dens<=3, `키워드 밀도 ${dens}%`, '3%를 넘으면 네이버 어뷰징 필터에 걸립니다'),
    C(avgPara>0 && avgPara<=200, `평균 문단 ${avgPara}자`, '모바일 가독성 기준 문단당 200자 이내로 끊으세요'),
    C(d.dates.length>=1, `발행 시점 표기 ${d.dates.length}건`, '최신성 반영을 위해 날짜를 본문에 명시'),
    C(d.author || d.experts.length>=1, '작성자·출처 명시', '기자·기관·직함을 밝혀야 신뢰 문서로 분류됩니다'),
  ];
  const pack = a => ({items:a, score:Math.round(a.filter(x=>x.ok).length/a.length*100)});
  return {seo:pack(seo), geo:pack(geo), aeo:pack(aeo), neo:pack(neo), dens, kw};
}
const gradeOf = s => s>=90?'우수':s>=70?'양호':s>=50?'보통':'개선 필요';

/* ── 3. 재작성 초안 ───────────────────────────── */
function ngrams(s){
  const t=String(s).replace(/[^가-힣A-Za-z0-9]/g,''); const set=new Set();
  for(let i=0;i<t.length-1;i++) set.add(t.slice(i,i+2));
  return set;
}
function bestSentence(sents,q,used,kw){
  const kt = tokens(kw);
  const g=ngrams(q); let best=null,bs=0;
  for(const s of sents){
    if(used.has(s)) continue;
    // 키워드와 무관한 문장을 답변으로 붙이지 않는다
    if(kt.length && !kt.some(w=>s.includes(w))) continue;
    const h=ngrams(s); let c=0; g.forEach(x=>{if(h.has(x))c++;});
    const sc=c/Math.max(1,g.size);
    if(sc>bs){bs=sc;best=s;}
  }
  if(best && bs>=0.22){used.add(best); return best;}
  return null;
}
/* ── 조사 처리 ────────────────────────────────────
   국립국어원 「한글 맞춤법」·「표준어 규정」의 조사 이형태 기준을 따른다.
   - 받침이 있으면 은/이/을/과/이란/이라, 없으면 는/가/를/와/란/라
   - '(으)로'만 예외: 받침이 없거나 ㄹ 받침이면 '로' (서울로, 물로) */
function jong(w){
  const t=String(w).trim(); if(!t) return -1;
  const c=t.charCodeAt(t.length-1);
  return (c>=0xAC00 && c<=0xD7A3) ? (c-0xAC00)%28 : -1;   // -1 = 한글 아님
}
const JOSA_PAIR = {'은':['은','는'],'이':['이','가'],'을':['을','를'],
                   '과':['과','와'],'란':['이란','란'],'라':['이라','라'],'로':['으로','로']};
function J(w,key){
  const [withB,noB]=JOSA_PAIR[key]; const j=jong(w);
  if(key==='로') return (j<=0 || j===8) ? noB : withB;    // 8 = ㄹ 받침
  return j>0 ? withB : noB;
}

/* 조사·어미가 붙은 어절에서 어간을 떼어낸다. 긴 것부터 검사해야 '에도'가 '도'로 잘리지 않는다.
   국립국어원 문법 자료의 조사 목록 기준. */
const JOSA_TAIL = ['에서부터','으로부터','에게서','으로서','으로써','이라는','이라고','에서는','에서도','에게는','에게도','까지도','부터는','만으로','이라도',
  '에는','에도','에게','에서','으로','라는','라고','까지','부터','조차','마저','밖에','처럼','보다','만큼','대로','이나','이란','에다','한테','더러','하고',
  '은','는','이','가','을','를','과','와','도','만','로','의','께','란','나','야'];
function stem(word){
  let w=String(word).trim();
  for(const t of JOSA_TAIL){
    if(w.length > t.length + 1 && w.endsWith(t)){       // 떼고도 2자 이상 남을 때만
      const cut=w.slice(0, w.length-t.length);
      if(cut.length>=2) return cut;
    }
  }
  return w;
}
function clip(s,n){s=String(s).replace(/\s+/g,' ').trim();return s.length<=n?s:s.slice(0,n-1)+'…';}

/* 한국어 소제목은 물음표 없이도 의문형으로 끝난다("~오나", "~될까", "~있는가").
   국립국어원 문법의 의문형 종결어미 기준으로 판별해 중복 변환을 막는다. */
const Q_END = /([?？]|느냐|더냐|는가|은가|ㄴ가|을까|ㄹ까|는지|을지|ㄹ지|나요|까요|나|까|냐|랴|뇨)$/;
function isQuestion(t){ return Q_END.test(String(t).trim()); }
function qHeading(t){
  const w=String(t).trim();
  // 이미 의문형이거나, 그 자체로 충분히 서술적인 긴 소제목은 건드리지 않는다
  if(isQuestion(w) || w.length>20) return w;
  return `${w}${J(w,'은')} 어떻게 되나`;
}
function draft(d,kw){
  const base = d.title || clip(d.sentences[0]||'',34);
  // 키워드 구성어의 절반 이상이 이미 제목에 있으면 원제를 살린다 — 통째로 덧붙이면 문장이 깨진다
  const kt = tokens(kw), hit = kt.filter(w=>base.includes(w)).length;
  const title = clip((kt.length && hit/kt.length >= 0.5) ? base : `${kw} ${base}`, 40);
  // 잘린 문장은 스니펫으로 쓰이지 못한다 — 40~140자 완결 문장을 우선 고르고, 수치가 든 것을 앞세운다
  const fit = d.sentences.filter(x=>x.length>=40 && x.length<=140);
  const ranked = [...fit.filter(x=>/\d/.test(x)), ...fit.filter(x=>!/\d/.test(x))];
  const tldr = (ranked.length ? ranked : d.sentences.map(x=>clip(x,140))).slice(0,3);
  const qs = [
    `${kw}${J(kw,'란')} 무엇인가요?`,
    `${kw}${J(kw,'이')} 왜 중요한가요?`,
    `${kw}${J(kw,'은')} 어떻게 적용하나요?`,
    `${kw} 관련 수치는 어떻게 되나요?`,
    `${kw}의 최신 동향은 무엇인가요?`,
  ];
  const used = new Set();
  const faq = qs.map(q=>({q, a: bestSentence(d.sentences,q,used,kw) || '(본문에 대응 문장이 없습니다 — 40~140자 직답으로 직접 채우세요)'}));
  return {title, tldr, faq};
}

/* ── 4. 재작성 문서 조립 ──────────────────────────
   기사에 실제로 실릴 내용만 만든다. 무엇을 바꿨는지 함께 기록해 [체크]에서 보여준다. */
function composeMd(d,kw,dr){
  const L=[], ch=[];
  const AX=(axis,why)=>L.push(`<\!--SF:${axis}|${why}-->`);   // axis: 'AEO' 또는 'AEO,GEO'
  if(dr.title!==d.title){
    ch.push(`제목 교체 — "${dr.title}"`);
    AX('SEO,NEO','타깃 키워드를 제목 앞쪽에 넣어 검색 노출을 잡는 자리입니다. 네이버는 25자에서 잘리니 길이도 함께 보세요.');
  }
  L.push(`# ${dr.title}`,'','<\!--SF:/-->');
  if(dr.tldr.length){
    ch.push(`상단 핵심 요약 ${dr.tldr.length}줄 추가 (AEO 스니펫용)`);
    AX('AEO,GEO','검색 답변·AI 요약으로 그대로 발췌되는 자리입니다. 수치가 든 문장을 우선 골라 인용 가능성을 높였습니다.');
    L.push(`> **핵심 ${dr.tldr.length}줄 요약**`);
    dr.tldr.forEach(t=>L.push(`> - ${t}`));
    L.push('','<\!--SF:/-->');
  }
  let qc=0;
  (d.secs||[]).forEach(sec=>{
    if(sec.heading){
      const q=qHeading(sec.heading);
      if(q!==sec.heading){ qc++; AX('AEO','소제목을 실제 검색 질문 형태로 바꾼 자리입니다. 질문에 그대로 매칭돼 답변으로 뽑힙니다.'); }
      L.push(`## ${q}`,'','<\!--SF:/-->');
    } else {
      AX('AEO','핵심 개념을 먼저 정의하는 도입 섹션입니다. 생성형 검색이 가장 먼저 인용하는 자리입니다.');
      L.push(`## ${kw}${J(kw,'란')} 무엇인가`,'','<\!--SF:/-->');
    }
    (sec.paras.length?sec.paras:['[본문 보강 필요]']).forEach(p=>L.push(p,''));
  });
  if(qc) ch.push(`소제목 ${qc}개를 질문형으로 변환 (AEO)`);
  if(!(d.secs||[]).some(x=>x.heading)) ch.push('소제목이 없어 도입 섹션을 새로 세움');
  const answered = dr.faq.filter(f=>!f.a.startsWith('(')).length;
  ch.push(`자주 묻는 질문 ${dr.faq.length}개 추가 — 본문 근거 ${answered}개, 직접 작성 필요 ${dr.faq.length-answered}개`);
  AX('AEO','자주 묻는 질문 블록입니다. 답변 엔진이 질문-답 쌍을 통째로 가져가며, FAQPage 구조화 데이터의 재료가 됩니다.');
  L.push('## 자주 묻는 질문','');
  dr.faq.forEach(f=>{ L.push(`### ${f.q}`, f.a, ''); });
  return {md:L.join('\n'), changes:ch};
}

/* 최소 마크다운 렌더러 — 이 앱이 만들어내는 문법(제목·인용·목록·굵게)만 처리한다 */
function mdToHtml(md){
  const out=[]; const lines=String(md).split('\n');
  let mode=null, buf=[];
  const flush=()=>{
    if(!mode) return;
    if(typeof openIfPending==='function') openIfPending();
    if(mode==='ul') out.push('<ul>'+buf.map(x=>`<li>${inline(x)}</li>`).join('')+'</ul>');
    if(mode==='quote'){
      const items=buf.filter(x=>/^-\s+/.test(x)).map(x=>x.replace(/^-\s+/,''));
      const head=buf.filter(x=>!/^-\s+/.test(x));
      out.push('<blockquote>'+head.map(x=>`<p>${inline(x)}</p>`).join('')+
        (items.length?'<ul>'+items.map(x=>`<li>${inline(x)}</li>`).join('')+'</ul>':'')+'</blockquote>');
    }
    if(mode==='code') out.push(`<pre>${esc(buf.join('\n'))}</pre>`);
    mode=null; buf=[];
  };
  let pendingAx=null, openAx=false;
  const closeAx=()=>{ if(openAx){ out.push('</div>'); openAx=false; } };
  const openIfPending=()=>{
    if(!pendingAx) return;
    closeAx();
    const keys = pendingAx.axis.split(',').map(x=>x.trim()).filter(Boolean);
    const chips = keys.map(k=>`<span class="axtag ax-${k.toLowerCase()}">${esc(k)}</span>`).join('');
    out.push(`<div class="axwrap ax-${(keys[0]||'aeo').toLowerCase()}">`+
      `<span class="axhead">${chips}<span class="axlabel">점수를 올리는 부분</span></span>`+
      `<span class="axwhy">${esc(pendingAx.why)}</span>`);
    openAx=true; pendingAx=null;
  };
  for(const raw of lines){
    const l=raw;
    if(/^<\!--SF:\/-->$/.test(l)){ flush(); closeAx(); continue; }
    const ax=l.match(/^<\!--SF:([^|]+)\|(.*)-->$/);
    if(ax){ flush(); closeAx(); pendingAx={axis:ax[1].trim(), why:ax[2].trim()}; continue; }
    if(/^```/.test(l)){ if(mode==='code'){flush();} else {flush();mode='code';} continue; }
    if(mode==='code'){ buf.push(l); continue; }
    if(/^>\s?/.test(l)){ if(mode!=='quote'){flush();mode='quote';} buf.push(l.replace(/^>\s?/,'')); continue; }
    if(/^\s*-\s+/.test(l)){ if(mode!=='ul'){flush();mode='ul';} buf.push(l.replace(/^\s*-\s+/,'')); continue; }
    flush();
    const h=l.match(/^(#{1,3})\s+(.*)$/);
    if(h){ openIfPending(); out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`); continue; }
    if(l.trim()){ openIfPending(); out.push(`<p>${inline(l)}</p>`); }
  }
  flush(); closeAx();
  return out.join('');
}
function inline(s){
  return esc(s)
    .replace(/!\[([^\]]*)\]\((https?:[^)\s]+)\)/g,(m,alt,u)=>`<img src="${u}" alt="${alt}" loading="lazy">`)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/(\[확인 필요\]|\(본문에 대응 문장이 없습니다[^)]*\)|\[본문 보강 필요\])/g,'<span class="flag">$1</span>');
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* ── 4.5 변경점 대조 ──────────────────────────────
   마크다운 문법은 걷어내고 '내용'만 비교한다. 공백을 토큰으로 남겨 원문 간격을 보존한다. */
function flatten(md){
  return String(md)
    .replace(/<\!--SF:[^>]*-->/g,'')                 // 축 표시 마커는 대조 대상이 아니다
    .replace(/```[\s\S]*?```/g,'')
    .replace(/!\[[^\]]*\]\([^)]*\)/g,'')
    .replace(/\[([^\]]*)\]\([^)]*\)/g,'$1')
    .replace(/^#{1,6}\s*/gm,'').replace(/^>\s?/gm,'').replace(/^\s*[-*]\s+/gm,'')
    .replace(/\*\*([^*]+)\*\*/g,'$1')
    .replace(/\n{2,}/g,'\n\n').trim();
}
function tokenize(t){ return t.match(/\s+|[^\s]+/g) || []; }
function lcsOps(a,b,ops){
  const n=a.length,m=b.length;
  const dp=new Int32Array((n+1)*(m+1)), W=m+1;
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--)
    dp[i*W+j] = a[i]===b[j] ? dp[(i+1)*W+j+1]+1 : Math.max(dp[(i+1)*W+j], dp[i*W+j+1]);
  let i=0,j=0;
  while(i<n && j<m){
    if(a[i]===b[j]){ ops.push(['=',a[i]]); i++; j++; }
    else if(dp[(i+1)*W+j] >= dp[i*W+j+1]){ ops.push(['-',a[i]]); i++; }
    else { ops.push(['+',b[j]]); j++; }
  }
  while(i<n) ops.push(['-',a[i++]]);
  while(j<m) ops.push(['+',b[j++]]);
}
function diffTokens(A,B){
  const ops=[];
  let s=0; while(s<A.length && s<B.length && A[s]===B[s]) s++;
  let e=0; while(e<A.length-s && e<B.length-s && A[A.length-1-e]===B[B.length-1-e]) e++;
  for(let i=0;i<s;i++) ops.push(['=',A[i]]);
  const a=A.slice(s,A.length-e), b=B.slice(s,B.length-e);
  // DP 비용이 폭발하는 긴 글은 통째로 교체된 것으로 표시한다
  if(a.length*b.length > 4000000){ if(a.length) ops.push(['-',a.join('')]); if(b.length) ops.push(['+',b.join('')]); }
  else lcsOps(a,b,ops);
  for(let i=A.length-e;i<A.length;i++) ops.push(['=',A[i]]);
  return ops;
}
function diffHtml(orig,rewritten){
  const ops = diffTokens(tokenize(flatten(orig)), tokenize(flatten(rewritten)));
  let add=0, del=0, keep=0, addSpots=0, delSpots=0, out='', run=null, buf='';
  const flushRun=()=>{
    if(run===null) return;
    if(run==='='){ out += esc(buf); }
    else if(run==='+'){ out += `<ins>${esc(buf)}</ins>`; if(buf.trim()) addSpots++; }
    else { out += `<del>${esc(buf)}</del>`; if(buf.trim()) delSpots++; }
    buf=''; run=null;
  };
  for(const [op,t] of ops){
    if(op!==run){ flushRun(); run=op; }
    buf += t;
    if(!/^\s+$/.test(t)){ if(op==='+') add++; else if(op==='-') del++; else keep++; }
  }
  flushRun();
  return {html:out, add, del, keep, addSpots, delSpots};
}

/* ── 6.5 API 키 ───────────────────────────────── */
async function verifyKey(key){
  const res=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':key,
      'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1,messages:[{role:'user',content:'ping'}]})
  });
  if(res.ok) return {ok:true, msg:'정상 — AI 재작성을 쓸 수 있습니다'};
  if(res.status===401||res.status===403) return {ok:false, msg:'키가 거부됐습니다. 콘솔에서 다시 확인하세요'};
  if(res.status===429) return {ok:true, msg:'키는 유효하지만 사용 한도를 넘었습니다'};
  return {ok:false, msg:'응답 '+res.status};
}
async function keysave(){
  const el=$('#apikey'); const k=(el&&el.value||'').trim();
  if(!k) return toast('키를 붙여넣으세요');
  if(!/^sk-ant-/.test(k)) return toast('sk-ant- 로 시작하는 키여야 합니다');
  $('#keyState').textContent='확인하는 중…';
  try{
    const r=await verifyKey(k);
    if(!r.ok){ $('#keyState').innerHTML=`<b style="color:var(--warn)">${esc(r.msg)}</b>`; return; }
    setKey(k); openMenu('mInput'); toast('AI 재작성이 켜졌습니다');
  }catch(e){ $('#keyState').innerHTML=`<b style="color:var(--warn)">연결 실패 — ${esc(e.message)}</b>`; }
}
async function keytest(){
  $('#keyState').textContent='확인하는 중…';
  try{
    const r=await verifyKey(getKey());

  }catch(e){ $('#keyState').innerHTML=`<b style="color:var(--warn)">연결 실패 — ${esc(e.message)}</b>`; }
}

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800);}
/* 워드·한글에 붙일 때 '##'이 글자로 남지 않도록, 서식 있는 형태(HTML)와
   기호 없는 순수 텍스트를 함께 클립보드에 넣는다. */
function plainText(md){
  return cleanMd(md).split('\n').map(l=>{
    const h=l.match(/^(#{1,6})\s+(.*)$/);            if(h) return h[2];
    const q=l.match(/^>\s?(.*)$/);                    if(q!==null) return q[1].replace(/^-\s+/,'· ').replace(/\*\*/g,'');
    const b=l.match(/^\s*([-*•]|\d+[.)])\s+(.*)$/);   if(b) return '· '+b[2];
    return l;
  }).join('\n').replace(/\*\*/g,'')
    .replace(/(?:^|(?<=\s))_([^_]+)_(?=\s|$|[.,·)])/gm,'$1')
    .replace(/\n{3,}/g,'\n\n').trim()+'\n';
}
async function copyArticle(md,label){
  const clean = cleanMd(md);
  const html = `<meta charset="utf-8"><div style="font-family:'맑은 고딕',sans-serif;line-height:1.7">${mdToHtml(clean)}</div>`;
  const text = plainText(md);
  try{
    await navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html],{type:'text/html'}),
      'text/plain': new Blob([text],{type:'text/plain'}),
    })]);
    toast((label||'')+' 복사했습니다 — 워드·한글에 서식 그대로 붙습니다');
  }catch(e){
    try{ await navigator.clipboard.writeText(text); toast((label||'')+' 복사했습니다'); }
    catch(e2){ toast('복사 실패'); }
  }
}
/* 화면 표기(축 마커)는 편집용이다 — 밖으로 나가는 텍스트에는 남기지 않는다 */
function cleanMd(md){
  return String(md||'')
    .replace(/^<\!--SF:[^>]*-->[ \t]*\n?/gm,'')
    .replace(/\n{3,}/g,'\n\n')
    .trim()+'\n';
}
function copy(text,label){ navigator.clipboard.writeText(text||'').then(()=>toast((label||'')+' 복사했습니다'),()=>toast('복사 실패')); }
/* ── 공유 링크 ────────────────────────────────────
   서버가 없으므로 진단 대상을 URL 해시에 담는다. 브라우저 기본 압축(deflate-raw)을 쓰고,
   지원하지 않는 환경에서는 압축 없이 담는다. */
const b64u = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const ub64 = str => {
  const b = atob(str.replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from(b, c=>c.charCodeAt(0));
};
async function makeShareUrl(){
  const payload = JSON.stringify({t:$('#src').value, k:STATE.kw, b:STATE.brand});
  let tag='p', bytes=new TextEncoder().encode(payload);
  try{
    const cs=new CompressionStream('deflate-raw');
    const buf=await new Response(new Blob([payload]).stream().pipeThrough(cs)).arrayBuffer();
    tag='z'; bytes=new Uint8Array(buf);
  }catch(e){ /* 압축 미지원 — 원본으로 담는다 */ }
  return location.origin+location.pathname+'#s='+tag+b64u(bytes);
}
async function shareLink(){
  if(!$('#src').value.trim()) return toast('먼저 원문을 넣으세요');
  const url = await makeShareUrl();
  if(url.length > 30000) return toast('원문이 너무 길어 링크로 담을 수 없습니다 — .md 저장을 쓰세요');
  copy(url,'공유 링크');
}
async function restoreFromHash(){
  const m=(location.hash||'').match(/^#s=(.)(.+)$/);
  if(!m) return false;
  try{
    const bytes=ub64(m[2]);
    let json;
    if(m[1]==='z'){
      const ds=new DecompressionStream('deflate-raw');
      json=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();
    } else json=new TextDecoder().decode(bytes);
    const o=JSON.parse(json);
    $('#src').value=o.t||''; STATE.kw=o.k||''; STATE.brand=o.b||''; MODE='text';
    await run();
    return true;
  }catch(e){ toast('공유 링크를 읽지 못했습니다'); return false; }
}

/* 리더 출력에는 사이트 메뉴·추천기사가 통째로 섞여 온다.
   줄마다 본문다움을 점수 내고 최고 점수 구간(Kadane)만 남긴다. */
function lineScore(l){
  const t=l.trim();
  if(!t) return 0;
  if(/^#{1,6}\s/.test(t)) return 0.5;                       // 소제목은 중립
  if(/^\s*([-*•]|\d+[.)])\s/.test(t)){
    // 목록이라고 다 메뉴가 아니다. 링크 덩어리면 메뉴·추천기사, 글이면 요약·체크포인트 같은 본문이다
    const body=t.replace(/^\s*([-*•]|\d+[.)])\s*/,'');
    const lc=(body.match(/\[[^\]]*\]\([^)]*\)/g)||[]).join('').length;
    if(lc/Math.max(1,body.length) > 0.3) return -1;
    return body.length>=20 ? 1.5 : -0.5;
  }
  if(/^!\[/.test(t)) return 0;                              // 사진·캡션 줄은 본문 구간을 끊지 않는다
  const linkChars=(t.match(/\[[^\]]*\]\([^)]*\)/g)||[]).join('').length;
  if(linkChars/t.length > 0.4) return -1;
  return t.length>=40 ? 2 : (t.length>=15 ? 0.5 : -0.2);
}
function extractBody(md){
  const lines=md.split('\n').filter(l=>!isNoiseLine(l));
  const w=lines.map(lineScore);
  let bs=-Infinity, ba=0, bb=0, cur=0, start=0;
  for(let i=0;i<w.length;i++){
    if(cur<=0){ cur=w[i]; start=i; } else cur+=w[i];
    if(cur>bs){ bs=cur; ba=start; bb=i; }
  }
  if(bs<=0) return md;
  // 대표 이미지는 본문 바로 앞에 붙는다 — 0점이라 구간 밖으로 밀리므로 되살린다
  while(ba>0 && /^\s*!\[/.test(lines[ba-1]||'')) ba--;
  const seg=lines.slice(ba,bb+1);
  // 구간 끝에 걸린 헤딩은 다음 블록(관련 기사·많이 본 뉴스)의 머리다 — 잘라낸다
  while(seg.length && /^\s*(#{1,6}\s|$)/.test(seg[seg.length-1])) seg.pop();
  const body=seg.join('\n').trim();
  if(body.length < 120) return md;                           // 추출 실패 시 원본 유지
  const head=(ba>0 && /^#\s/.test(lines[0])) ? lines[0]+'\n\n' : '';
  return head+body;
}
async function fetchUrl(u){
  const res = await fetch('https://r.jina.ai/'+u);
  if(!res.ok) throw new Error('HTTP '+res.status);
  const t = await res.text();
  // 리더가 붙이는 머리말을 마크다운 제목으로 바꾼다
  const md = t.replace(/^Title:\s*(.*?)(?:\s*[-|–—]\s*[^-|–—]{1,20})?\s*\n+(?:URL Source:.*\n+)?(?:Published Time:.*\n+)?(?:Markdown Content:\s*\n*)?/, '# $1\n\n');
  return extractBody(md);
}
async function run(){

  if(MODE==='url'){

      return toast(blocked
        ? '이 환경에서는 외부 요청이 차단됩니다 — 기사 본문을 붙여넣어 주세요'
        : '불러오기 실패: '+e.message);
    }

  }
  if(!raw.trim()) return toast('원문을 넣으세요');
  syncCount();
  const d = parse(raw);
  const kw = (STATE.kw||'').trim() || autoKeyword(d);
  STATE.kw = kw;

  if(getKey() && CFG.autoRewrite!==false){

  } else {

  }
}

function toMarkdown(){
  if(!LAST) return '';
  const {d,r,kw}=LAST;
  const head = `# 검색 최적화 진단 리포트\n\n- 대상: ${d.title||'(제목 없음)'}\n- 타깃 키워드: ${kw}\n- 분량: ${d.chars}자 · 키워드 밀도 ${r.dens}%\n- 생성일: ${new Date().toISOString().slice(0,10)}\n`;
  const scores = '\n## 점수\n\n| 축 | 점수 | 등급 |\n|---|---|---|\n' +
    AXES.map(a=>`| ${a.name} | ${r[a.k].score} | ${gradeOf(r[a.k].score)} |`).join('\n') + '\n';
  const detail = AXES.map(a=>`\n### ${a.name} — ${a.full}\n\n` +
    r[a.k].items.map(c=>`- [${c.ok?'x':' '}] ${c.t}${c.ok?'':` → ${c.f}`}`).join('\n')).join('\n');
  const chg = AIMD ? '' : `\n\n## 무엇을 바꿨나\n\n${CHANGES.map(c=>'- '+c).join('\n')}\n`;
  return head+scores+'\n## 항목별 진단\n'+detail+chg+`\n\n---\n\n# 재작성 전문${AIMD?' (AI)':' (규칙 초안)'}\n\n`+cleanMd(AIMD||MD);
}

    renderOut();

    return false;
  }

/* ── 8. 좌우 폭 조절 ──────────────────────────── */
const MINW=340;
function clampSplit(x,total){ return Math.min(Math.max(x,MINW), total-MINW-8); }
(function splitter(){
  const h=$('#handle'), panes=$('#panes');
  let dragging=false;
  const apply=x=>{
    const box=panes.getBoundingClientRect();
    const w=clampSplit(x-box.left, box.width);
    panes.style.setProperty('--split', w+'px');
  };
  h.addEventListener('pointerdown',e=>{
    dragging=true; h.classList.add('drag'); document.body.classList.add('resizing'); e.preventDefault();
  });
  document.addEventListener('pointermove',e=>{ if(dragging) apply(e.clientX); });
  document.addEventListener('pointerup',()=>{
    if(!dragging) return;
    dragging=false; h.classList.remove('drag'); document.body.classList.remove('resizing');
  });
  h.addEventListener('dblclick',()=>panes.style.setProperty('--split','calc(50% - 4px)'));
})();
